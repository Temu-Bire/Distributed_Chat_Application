spring:
  application:
    name: chat-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chatsphere;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${PORT:8080}

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

chat:
  distributed:
    enabled: ${CHAT_DISTRIBUTED_ENABLED:false}
  inbound:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500
  outbound:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500

logging:
  level:
    root: INFO
    com.example.chat: INFO
