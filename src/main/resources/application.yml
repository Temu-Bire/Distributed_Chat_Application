spring:
  application:
    name: chat-app

server:
  port: 8080

# ---------------------------------------------------------------------------
# All chat settings have defaults declared in ChatProperties. Override them
# here when you need to; nothing below is required for the defaults to work.
#
# chat:
#   # Browser origins allowed to open the /ws handshake. Keep this tight.
#   allowed-origins:
#     - http://localhost:8080
#     - http://127.0.0.1:8080
#
#   # Bounded STOMP channel executors (see docs/architecture.md, "Concurrency").
#   inbound:  { core-pool-size: 4, max-pool-size: 16, queue-capacity: 500 }
#   outbound: { core-pool-size: 4, max-pool-size: 16, queue-capacity: 1000 }
#
#   # Slow-client protection.
#   send-time-limit-ms: 10000
#   send-buffer-size-limit-bytes: 524288
#   max-inbound-frame-bytes: 65536
# ---------------------------------------------------------------------------

logging:
  level:
    root: INFO
    com.example.chat: INFO
