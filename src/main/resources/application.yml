spring:
  application:
    name: chat-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chatsphere;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${PORT:8081}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        # Lax blocks the cookie on cross-site POSTs (the CSRF hole that let
        # disabled CSRF be tolerable) while still allowing same-site navigation.
        same-site: lax
        # Set behind TLS-terminating deployments: COOKIE_SECURE=true.
        secure: ${COOKIE_SECURE:false}

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

chat:
  distributed:
    enabled: ${CHAT_DISTRIBUTED_ENABLED:false}
  rate-limit:
    enabled: ${CHAT_RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN:10}
    register-per-minute: ${RATE_LIMIT_REGISTER:5}
    friend-request-per-minute: ${RATE_LIMIT_FRIEND_REQUESTS:20}
    messages-per-minute: ${RATE_LIMIT_MESSAGES:60}
  inbound:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500
  outbound:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500

logging:
  level:
    root: INFO
    com.example.chat: INFO
