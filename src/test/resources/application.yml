spring:
  application:
    name: chat-app-test
  datasource:
    url: jdbc:h2:mem:chat_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Same contract as production: migrations are the only schema writer,
      # and every test boot verifies the entities still match them.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

chat:
  # Limits are covered by their own dedicated tests; the behavioural suites
  # register and message heavily from one IP and must not be throttled.
  rate-limit:
    enabled: false
